# fuzzel — auto-loaded from $XDG_CONFIG_HOME/fuzzel/fuzzel.ini
# Validate with:  fuzzel --check-config
# Docs:          https://man.archlinux.org/man/fuzzel.1
#
# NOTE: only [main] and [colors] sections exist. border-radius,
# border-width and the fuzzy-* knobs are CLI-only; pass them as
# arguments in hyprland.lua if you want them.

[main]
font = FiraCode Nerd Font,Noto Sans Mono CJK SC,Noto Color Emoji:size=13
lines = 12
width = 44
anchor = center
horizontal-pad = 12
vertical-pad = 8
inner-pad = 4
tabs = 4
prompt = "> "
placeholder = "Type to search..."
match-mode = fuzzy
auto-select = yes
hide-before-typing = no
icon-theme = default

[colors]
background = 000000bf
text = ffffff0f
prompt = cba6f7ff
placeholder = 6c7086ff
input = cdcdd6ff
message = 9399b2ff
match = ffffffff
selection = fffffff0
selection-text = 000000f0
selection-match = 000000f0
border = 00000000
